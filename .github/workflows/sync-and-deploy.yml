name: Deploy Upstream Web

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: AmintaCCCP/GithubStarsManager
          ref: main

      - name: Disable web update prompts
        run: |
          cat > src/components/UpdateChecker.tsx <<'EOF'
          import React from 'react';
          import type { VersionInfo } from '../services/updateService';

          interface UpdateCheckerProps {
            onUpdateAvailable?: (version: VersionInfo) => void;
          }

          export const UpdateChecker: React.FC<UpdateCheckerProps> = () => null;
          EOF

          cat > src/components/UpdateNotificationBanner.tsx <<'EOF'
          import React from 'react';

          export const UpdateNotificationBanner: React.FC = () => null;
          EOF

      - name: Apply mobile layout fixes for discovery pages
        run: |
          node <<'EOF'
          const fs = require('fs');

          function replaceOnce(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) {
              throw new Error(`Expected source pattern not found in ${path}`);
            }
            fs.writeFileSync(path, source.replace(from, to));
          }

          replaceOnce(
            'src/components/DiscoveryView.tsx',
            '    <div className="flex flex-col">\n',
            '    <div className="flex flex-col min-w-0 max-w-full" data-discovery-root>\n'
          );

          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className={\`bg-white dark:bg-panel-dark border border-black/[0.06] dark:border-white/[0.04] p-5 transition-all duration-200 ${',
            'data-discovery-card\n      className={\`bg-white dark:bg-panel-dark border border-black/[0.06] dark:border-white/[0.04] p-3 sm:p-5 transition-all duration-200 ${'
          );

          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className="font-semibold text-gray-900 dark:text-text-primary truncate"',
            'className="min-w-0 flex-1 font-semibold text-gray-900 dark:text-text-primary truncate"'
          );

          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className="flex items-center gap-4 text-sm text-gray-500 dark:text-text-tertiary"',
            'className="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm text-gray-500 dark:text-text-tertiary"'
          );
          EOF

          cat >> src/index.css <<'EOF'

          /* Web deployment: keep all discovery channels usable on narrow screens. */
          @media (max-width: 639px) {
            html,
            body,
            #root {
              width: 100%;
              max-width: 100%;
              overflow-x: hidden;
            }

            #root main,
            [data-discovery-root],
            [data-discovery-root] > div,
            [data-discovery-root] [class~="flex-1"] {
              min-width: 0;
              max-width: 100%;
            }

            [data-discovery-root] [role="tablist"] {
              max-width: 100%;
              overscroll-behavior-x: contain;
            }

            [data-discovery-card] {
              width: 100%;
              max-width: 100%;
              overflow: hidden;
            }

            [data-discovery-card] .truncate {
              min-width: 0;
            }
          }
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=github-stars
