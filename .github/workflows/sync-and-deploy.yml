name: Deploy Upstream Web

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: AmintaCCCP/GithubStarsManager
          ref: v0.9.0

      - name: Disable web update prompts
        run: |
          cat > src/components/UpdateChecker.tsx <<'EOF'
          import React from 'react';
          import type { VersionInfo } from '../services/updateService';

          interface UpdateCheckerProps {
            onUpdateAvailable?: (version: VersionInfo) => void;
          }

          export const UpdateChecker: React.FC<UpdateCheckerProps> = () => null;
          EOF

          cat > src/components/UpdateNotificationBanner.tsx <<'EOF'
          import React from 'react';

          export const UpdateNotificationBanner: React.FC = () => null;
          EOF

      - name: Restore mobile web fixes (v12)
        run: |
          node <<'EOF'
          const fs = require('fs');

          // Mobile web fixes v12 (upstream pinned to v0.9.0 + full-assets precache sweep, 2026-11-12).
          // v1 targeted upstream v0.6.2; upstream has since absorbed or superseded
          // many fixes in its Radix redesign. Each op below was verified against
          // current upstream source: kept = anchor intact, reworked = same intent,
          // new anchor. Dropped ops and reasons are listed in the workflow PR/commit.

          function replaceOnce(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) {
              throw new Error('Expected source pattern not found in ' + path);
            }
            fs.writeFileSync(path, source.replace(from, to));
          }

          function replaceRegex(path, pattern, replacement) {
            const source = fs.readFileSync(path, 'utf8');
            if (!pattern.test(source)) {
              throw new Error('Expected source pattern not found in ' + path);
            }
            fs.writeFileSync(path, source.replace(pattern, replacement));
          }

          function replaceAll(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) {
              throw new Error('Expected source pattern not found in ' + path);
            }
            fs.writeFileSync(path, source.split(from).join(to));
          }

          function removeDescriptionTooltips(path) {
            const source = fs.readFileSync(path, 'utf8');
            const withoutImport = source.replace(/import { FloatingTooltip } from '\.\/FloatingTooltip';\n/, '');
            const withoutTooltips = withoutImport.replace(/\n\s*<FloatingTooltip[\s\S]*?\/>\n/g, '\n');
            if (withoutTooltips === source) {
              throw new Error('Expected FloatingTooltip usage not found in ' + path);
            }
            fs.writeFileSync(path, withoutTooltips);
          }

          replaceOnce(
            'vite.config.ts',
            "import legacy from '@vitejs/plugin-legacy';",
            "import legacy from '@vitejs/plugin-legacy';\nimport { VitePWA } from 'vite-plugin-pwa';"
          );
          replaceOnce(
            'vite.config.ts',
            "    }),\n  ],",
            `    }),\n    VitePWA({\n      registerType: 'autoUpdate',\n      includeAssets: ['icon.png', 'fonts/inter.css', 'fonts/*.woff2'],\n      manifest: {\n        name: 'GitHub Stars Manager',\n        short_name: 'Stars Manager',\n        description: 'AI-Powered GitHub Star Repository Management',\n        theme_color: '#0d1117',\n        background_color: '#0d1117',\n        display: 'standalone',\n        orientation: 'portrait',\n        icons: [{ src: 'icon.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' }],\n      },\n      workbox: {\n        globPatterns: ['**/*.{js,css,html,ico,png,svg,woff2}'],\n        maximumFileSizeToCacheInBytes: 4 * 1024 * 1024,\n      },\n    }),\n  ],`
          );

          replaceOnce(
            'index.html',
            '<meta name="viewport" content="width=device-width, initial-scale=1.0" />',
            '<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />\n    <meta name="theme-color" content="#0d1117" />\n    <meta name="apple-mobile-web-app-capable" content="yes" />\n    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />\n    <meta name="apple-mobile-web-app-title" content="Stars Manager" />\n    <meta name="format-detection" content="telephone=no" />'
          );

          // --- Safe area: LoginScreen top-right controls (reworked; class order changed) ---
          replaceOnce(
            'src/components/LoginScreen.tsx',
            '<div className="fixed right-4 top-4 z-50 flex items-center gap-2">',
            '<div className="fixed right-4 z-50 flex items-center gap-2" style={{ top: \'calc(env(safe-area-inset-top, 0px) + 16px)\' }}>'
          );

          // --- Safe area: Toast viewport (reworked; Toast was rewritten on Radix,
          //     viewport now lives in src/hooks/useDialog.tsx) ---
          replaceOnce(
            'src/hooks/useDialog.tsx',
            '<ToastPrimitive.Viewport className="pointer-events-none fixed inset-0 z-[100] flex flex-col items-end gap-2 p-4" />',
            '<ToastPrimitive.Viewport className="pointer-events-none fixed inset-0 z-[100] flex flex-col items-end gap-2 p-4" style={{ paddingTop: \'calc(env(safe-area-inset-top, 0px) + 16px)\' }} />'
          );

          // --- App root overflow guard (kept from v1, anchor verified) ---
          replaceOnce(
            'src/App.tsx',
            'transition-colors duration-200">',
            'transition-colors duration-200 overflow-x-hidden">'
          );

          // --- DiscoveryView (kept root; sidebar/content reworked to current markup) ---
          replaceOnce(
            'src/components/DiscoveryView.tsx',
            '    <div className="flex flex-col">\n',
            '    <div className="flex flex-col overflow-x-hidden min-w-0 w-full box-border" data-discovery-root>\n'
          );
          replaceOnce(
            'src/components/DiscoveryView.tsx',
            'className={`flex-shrink-0 pr-2 transition-transform duration-300 ease-in-out z-10 ${',
            'className={`flex-shrink-0 overflow-x-hidden pr-2 transition-transform duration-300 ease-in-out z-10 ${'
          );
          replaceOnce(
            'src/components/DiscoveryView.tsx',
            'className="flex-1 overflow-y-auto space-y-4 pr-2"',
            'className="flex-1 overflow-y-auto overflow-x-hidden space-y-4"'
          );

          // --- SubscriptionRepoCard (root reworked to upstream class-based card;
          //     inner rows kept/reworked; upstream CSS handles padding via .app-discovery-card) ---
          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className="app-list-row app-discovery-card ui-card transition-all duration-200 cursor-pointer"',
            'className="app-list-row app-discovery-card ui-card transition-all duration-200 cursor-pointer w-full overflow-hidden"'
          );
          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className="flex items-start gap-3 sm:gap-4">',
            'className="flex items-start gap-3 sm:gap-4 min-w-0">'
          );
          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className="flex-1 min-w-0">',
            'className="flex-1 min-w-0 overflow-hidden">'
          );
          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className="font-semibold text-foreground dark:text-foreground truncate"',
            'className="min-w-0 flex-1 font-semibold text-foreground dark:text-foreground truncate"'
          );
          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className="flex items-center gap-4 text-sm text-muted-foreground dark:text-muted-foreground">',
            'className="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm text-muted-foreground dark:text-muted-foreground">'
          );

          // --- AIConfigPanel (header restructure kept; item title/desc reworked.
          //     v1 button ops dropped: upstream switched to shared Button components
          //     and icon buttons, the old overflow problems no longer exist.) ---
          replaceRegex(
            'src/components/settings/AIConfigPanel.tsx',
            /<div className="flex items-center justify-between">\n\s+<div className="flex items-center space-x-3">/,
            '<div className="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">\n              <div className="flex items-start space-x-3 min-w-0">'
          );
          replaceOnce(
            'src/components/settings/AIConfigPanel.tsx',
            '<h4 className="font-medium text-foreground dark:text-foreground flex items-center">',
            '<h4 className="font-medium text-foreground dark:text-foreground flex items-center flex-wrap gap-1">'
          );
          replaceOnce(
            'src/components/settings/AIConfigPanel.tsx',
            'className="text-sm text-muted-foreground dark:text-muted-foreground">\n                    {(config.apiType || \'openai\').toUpperCase()}',
            'className="text-sm text-muted-foreground dark:text-muted-foreground break-all">\n                    {(config.apiType || \'openai\').toUpperCase()}'
          );

          // --- ReadmeModal (reworked for the fullscreen Radix Dialog rewrite:
          //     safe-area top padding on the header, truncating title. The old
          //     bottom-sheet / TOC / actions ops are superseded by the rewrite.) ---
          replaceOnce(
            'src/components/ReadmeModal.tsx',
            'className="flex flex-wrap items-center gap-3 border-b border-border p-4 dark:border-border">',
            'className="flex flex-wrap items-center gap-3 border-b border-border p-4 dark:border-border" style={{ paddingTop: \'max(1rem, env(safe-area-inset-top))\' }}>'
          );
          replaceOnce(
            'src/components/ReadmeModal.tsx',
            '<DialogTitle className="text-lg font-semibold text-foreground dark:text-foreground">',
            '<DialogTitle className="min-w-0 truncate text-lg font-semibold text-foreground dark:text-foreground">'
          );

          // --- AI settings: mark the config card so the appended CSS can fix its
          // mobile overflow (header row cannot shrink, delete button off-screen).
          replaceOnce('src/components/settings/AIConfigPanel.tsx',
            'className={`p-4 rounded-lg border transition-colors ${',
            'data-ai-config-card="" className={`p-4 rounded-lg border transition-colors ${');

          // Overlay audit: tag the shared sheet/dialog content primitives so the
          // appended CSS can add safe-area top padding to every top-anchored
          // full-screen overlay at once (release sheet, chat sheets, README and
          // other fullscreen dialogs all slide under the Dynamic Island).
          replaceOnce('src/components/ui/sheet.tsx',
            "'fixed z-50 flex flex-col gap-4 bg-card p-5 text-card-foreground shadow-dialog transition ease-in-out data-[state=closed]:animate-out data-[state=open]:animate-in data-[state=closed]:duration-300 data-[state=open]:duration-500',",
            "'app-sheet-content fixed z-50 flex flex-col gap-4 bg-card p-5 text-card-foreground shadow-dialog transition ease-in-out data-[state=closed]:animate-out data-[state=open]:animate-in data-[state=closed]:duration-300 data-[state=open]:duration-500',");
          replaceOnce('src/components/RepositoryChatSheet.tsx',
            '<div className="px-3 pr-12">',
            '<div className="repo-chat-panel-header px-3 pr-12">');

          replaceOnce('src/components/Header.tsx',
            '<DropdownMenuContent align="end" className="w-56 md:hidden">',
            '<DropdownMenuContent align="end" data-header-mobile-menu="" className="w-56 md:hidden">');
          EOF

          cat >> src/index.css <<'EOF'

          /* Web deployment: mobile web fixes v2 (2026-11-06). */
          @media (max-width: 768px) {
            select {
              max-width: calc(100vw - 4rem);
              min-width: 0;
            }

            main * {
              min-width: 0;
            }
          }

          @media (max-width: 639px) {
            html,
            body,
            #root {
              width: 100%;
              max-width: 100%;
              overflow-x: hidden;
            }

            [data-discovery-root],
            [data-discovery-root] > div,
            [data-discovery-root] [class~="flex-1"] {
              min-width: 0;
              max-width: 100%;
            }

            [data-discovery-root] [role="tablist"] {
              max-width: 100%;
              overscroll-behavior-x: contain;
            }

            .app-discovery-card {
              width: 100%;
              max-width: 100%;
              overflow: hidden;
            }

            .app-discovery-card .truncate {
              min-width: 0;
            }
          }

          /* Standalone PWA: upstream 0.9.0 sizes its fixed header from the
             --app-header-height token (currently 3.375rem). Grow the token by the
             top safe-area inset so the header clears the notch / Dynamic Island.
             (Padding the header element instead overflows its fixed-height box
             and paints the header content over the next row — seen in the iOS
             standalone app.) --app-header-offset derives from this token, so
             sticky elements below the header stay aligned. */
          :root {
            --app-header-height: calc(3.375rem + env(safe-area-inset-top, 0px));
          }

          /* Mobile layout fixes (NEO feedback 2026-11-06, patch v4):
             1) Header buttons vertically center inside the grown header token, so
                in standalone they ride up against the Dynamic Island. Pin the
                inner row to the bottom token-height of the header: buttons keep a
                full safe-area of dead space above them. */
          .linear-header-inner {
            height: 3.375rem;
            margin-top: min(env(safe-area-inset-top, 0px), 10px);
          }

          /* 1b) The header's inner layout wrapper (.app-header-inner around the
             .linear-header-inner row) is height:100% of the grown header in
             upstream's final parity block, so the row's margin-top safe-area
             shift overflows the header box and leaves a full safe-area of dead
             space under the buttons. Let the wrapper size to the row instead. */
          .app-header-inner {
            height: auto;
          }

          /* 1c) The sticky header element itself still carries height:100% (via
             the shared .app-header-inner,.linear-header-inner rule) with <body>
             as its containing block, which stretched it far past its content and
             left the big dead band under the buttons. Let it size to content:
             grown token as min-height, auto height. */
          header.linear-header {
            height: auto;
          }

          /* 2) The upstream 0.9.0 mobile nav is a w-56 (14rem) Radix dropdown
             anchored to the hamburger button; NEO's previous build had a
             full-width menu bar under the header. Stretch the panel across the
             viewport (same 1rem gutters as the old bar). */
          [data-radix-popper-content-wrapper]:has(> [data-header-mobile-menu]) {
            left: 1rem !important;
            right: 1rem !important;
          }
          [data-header-mobile-menu] {
            width: 100% !important;
          }

          /* 3) The repository controls bar loses its mobile stacking in upstream
             0.9.0 (an index.css parity block forces row + space-between at every
             width), which centers the AI-analysis button in a squished half row,
             indents the display-content radios and clips the stats line at the
             right edge. Restore the stacked full-width layout on small screens. */
          @media (max-width: 639px) {
            .app-repository-controls {
              flex-direction: column;
              align-items: stretch;
              justify-content: flex-start;
            }
            .app-repository-controls > div:last-child {
              align-items: flex-start;
            }
            .app-repository-controls .app-context-row-copy {
              overflow-wrap: break-word;
            }
          }

          /* === v8 final (2026-11-07): gap tuning + diagnostic cleanup ===
             Red marker and banner log removed. The inner row keeps only a small
             fixed offset below the notch instead of the full safe-area inset;
             the grown header token is unchanged, so the dead band below the
             buttons is now just the small remainder. */
          header.linear-header {
            height: calc(3.375rem + env(safe-area-inset-top, 0px)) !important;
          }

          /* === v9: GPT scheme (2026-11-07) ===
             Safe area moves OFF the row's margin and INTO the middle wrapper's
             padding-top; all three layers get explicit heights via stronger
             child selectors. --app-header-height returns to the plain row height
             and --app-header-offset is redefined to the true total, so sidebar
             min-height / sticky offsets stay consistent. Two deviations from the
             consulted draft: padding-top only (its shorthand would have zeroed
             the wrapper's inline gutter padding), and the safe-top variable is
             env()-driven unconditionally (Safari tab mode computes it to 0). */
          :root {
            --app-header-height: 3.375rem;
            --ios-header-safe-top: env(safe-area-inset-top, 0px);
            --ios-header-total-height: calc(3.375rem + var(--ios-header-safe-top));
            --app-header-offset: calc(var(--ios-header-total-height) + 1px);
          }
          header.linear-header.sticky {
            box-sizing: border-box !important;
            height: var(--ios-header-total-height) !important;
            min-height: var(--ios-header-total-height) !important;
            max-height: var(--ios-header-total-height) !important;
            padding: 0 !important;
            margin: 0 !important;
            top: 0 !important;
          }
          header.linear-header.sticky > .app-header-inner {
            box-sizing: border-box !important;
            height: 100% !important;
            min-height: 0 !important;
            padding-top: var(--ios-header-safe-top) !important;
            margin: 0 !important;
          }
          header.linear-header.sticky > .app-header-inner > .linear-header-inner {
            box-sizing: border-box !important;
            height: 3.375rem !important;
            min-height: 3.375rem !important;
            max-height: 3.375rem !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            flex-shrink: 0;
          }

          /* === v10: AI config card overflow (2026-11-07) ===
             The config card header is a fixed row: identity block on the left,
             three icon buttons on the right. On narrow screens the identity
             block cannot shrink (long name + badge + unbroken URL line), so the
             delete button is pushed past the right edge. Mobile-only: allow the
             header row to wrap so the buttons drop to their own right-aligned
             row, let the identity block shrink, and break the long detail line
             anywhere. Desktop layout untouched. */
          @media (max-width: 639px) {
            [data-ai-config-card] > div {
              flex-wrap: wrap;
              row-gap: 0.5rem;
            }
            [data-ai-config-card] > div > div {
              min-width: 0;
            }
            [data-ai-config-card] > div > div:last-child {
              margin-left: auto;
            }
            [data-ai-config-card] p {
              overflow-wrap: anywhere;
            }
          }

          /* === v11: full-screen overlays vs the iOS status bar (2026-11-07) ===
             Audit of every top-anchored overlay in upstream 0.9.0: side sheets
             (release viewer, chat history, repository chat) and fullscreen
             dialogs (README, repository card, plugin pages/marketplace) all
             anchor at top:0 / inset:0 with no safe-area handling, so their
             titles and close buttons slide under the Dynamic Island in the
             standalone app. Centered dialogs, the main header (v9), menus and
             toasts do not reach the status bar. Fix at the shared layer:
             side="right" sheets are full-height right panels identified by
             Tailwind's inset-y-0 (dialog content never carries that class), and
             fullscreen dialogs carry .app-dialog-fullscreen. The panel itself
             stays full-bleed; only its inner top padding grows by the safe-area
             inset, so content starts below the island. Adding the inset
             unconditionally is safe in a browser tab, where env() computes 0. */
          .app-sheet-content.inset-y-0 {
            padding-top: calc(1.25rem + env(safe-area-inset-top, 0px));
          }
          .app-dialog-content.app-dialog-fullscreen {
            padding-top: calc(1.25rem + env(safe-area-inset-top, 0px));
          }
          /* The repository chat sheet zeroes its own padding (p-0) and draws its
             own header, so pad that header instead of the sheet box. */
          .app-sheet-content.inset-y-0.p-0 {
            padding-top: 0;
          }
          .app-sheet-content.inset-y-0.p-0 .repo-chat-panel-header {
            padding-top: calc(0.75rem + env(safe-area-inset-top, 0px));
          }
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PWA build plugin
        run: npm install --no-save vite-plugin-pwa@1.3.0

      - name: Build
        run: npm run build

      - name: Regenerate service worker precache
        run: |
          node <<'EOF'
          // Regenerate dist/sw.js with a correct precache manifest.
          // The vite-plugin-pwa generateSW integration collects no entries under
          // the current upstream toolchain (Vite 8 / rolldown): the deployed
          // service worker precached only icon.png + manifest.webmanifest while
          // its navigation route points at index.html. This post-build step
          // rebuilds the service worker from the finished dist instead: the app
          // shell is exactly what dist/index.html references (entry chunks,
          // vendors, css) plus the root statics.
          const fs = require('fs');
          const crypto = require('crypto');
          const { generateSW } = require('workbox-build');

          function md5(path) {
            return crypto.createHash('md5').update(fs.readFileSync(path)).digest('hex');
          }

          (async () => {
            const html = fs.readFileSync('dist/index.html', 'utf8');
            const urls = new Set();
            const re = /(?:src|href)="(\.\/)?([^"]+)"/g;
            let m;
            while ((m = re.exec(html)) !== null) {
              const u = m[2];
              if (/^(https?:|data:|#)/.test(u)) continue;
              if (u === 'sw.js') continue;
              urls.add(u);
            }
            ['index.html', 'registerSW.js', 'manifest.webmanifest', 'icon.png', 'icon.svg'].forEach((f) => {
              if (fs.existsSync('dist/' + f)) urls.add(f);
            });
            // Runtime sweep: statically imported chunks live in the entry's
            // module graph, not in index.html. The bootstrap dynamically loads
            // the per-language, per-namespace locale JSON chunks; if one is
            // missing from the precache, the standalone app's navigation
            // fallback answers the chunk request with index.html, the dynamic
            // import throws, and startup dies on the fallback error page
            // (observed 2026-11-12 after upstream's post-0.9.0 main drift
            // restructured the i18n loading). Precache the whole dist/assets
            // JS/CSS set plus the locale JSONs so no startup-path request can
            // fall into the fallback.
            function sweep(dir, prefix) {
              for (const name of fs.readdirSync(dir)) {
                const p = dir + '/' + name;
                if (fs.statSync(p).isDirectory()) sweep(p, prefix + name + '/');
                else if (/\.(js|css|json)$/.test(name)) urls.add(prefix + name);
              }
            }
            sweep('dist/assets', 'assets/');

            const entries = [...urls]
              .filter((u) => {
                try {
                  return fs.statSync('dist/' + u).isFile();
                } catch (e) {
                  return false;
                }
              })
              .map((u) => ({
                url: u,
                revision: u.includes('assets/') ? null : md5('dist/' + u),
              }));
            console.log('app-shell entries:', entries.length);

            const { count, warnings } = await generateSW({
              swDest: 'dist/sw.js',
              globDirectory: 'dist',
              globPatterns: [],
              additionalManifestEntries: entries,
              skipWaiting: true,
              clientsClaim: true,
              cleanupOutdatedCaches: true,
              navigateFallback: 'index.html',
              maximumFileSizeToCacheInBytes: 4 * 1024 * 1024,
            });
            (warnings || []).forEach((w) => console.warn(w));
            console.log('precache entries written:', count);
            if (count < 10) {
              throw new Error('precache regeneration produced too few entries: ' + count);
            }
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=github-stars
