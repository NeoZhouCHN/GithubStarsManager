name: Deploy Upstream Web

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: AmintaCCCP/GithubStarsManager
          ref: main

      - name: Disable web update prompts
        run: |
          cat > src/components/UpdateChecker.tsx <<'EOF'
          import React from 'react';
          import type { VersionInfo } from '../services/updateService';

          interface UpdateCheckerProps {
            onUpdateAvailable?: (version: VersionInfo) => void;
          }

          export const UpdateChecker: React.FC<UpdateCheckerProps> = () => null;
          EOF

          cat > src/components/UpdateNotificationBanner.tsx <<'EOF'
          import React from 'react';

          export const UpdateNotificationBanner: React.FC = () => null;
          EOF

      - name: Restore v0.6.2 mobile web fixes
        run: |
          node <<'EOF'
          const fs = require('fs');

          function replaceOnce(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) {
              throw new Error('Expected source pattern not found in ' + path);
            }
            fs.writeFileSync(path, source.replace(from, to));
          }

          function replaceRegex(path, pattern, replacement) {
            const source = fs.readFileSync(path, 'utf8');
            if (!pattern.test(source)) {
              throw new Error('Expected source pattern not found in ' + path);
            }
            fs.writeFileSync(path, source.replace(pattern, replacement));
          }

          replaceOnce(
            'vite.config.ts',
            "import legacy from '@vitejs/plugin-legacy';",
            "import legacy from '@vitejs/plugin-legacy';\nimport { VitePWA } from 'vite-plugin-pwa';"
          );
          replaceOnce(
            'vite.config.ts',
            "    }),\n  ],",
            `    }),\n    VitePWA({\n      registerType: 'autoUpdate',\n      includeAssets: ['icon.png', 'fonts/inter.css', 'fonts/*.woff2'],\n      manifest: {\n        name: 'GitHub Stars Manager',\n        short_name: 'Stars Manager',\n        description: 'AI-Powered GitHub Star Repository Management',\n        theme_color: '#0d1117',\n        background_color: '#0d1117',\n        display: 'standalone',\n        orientation: 'portrait',\n        icons: [{ src: 'icon.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' }],\n      },\n      workbox: {\n        globPatterns: ['**/*.{js,css,html,ico,png,svg,woff2}'],\n        maximumFileSizeToCacheInBytes: 4 * 1024 * 1024,\n      },\n    }),\n  ],`
          );

          replaceOnce(
            'index.html',
            '<meta name="viewport" content="width=device-width, initial-scale=1.0" />',
            '<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />\n    <meta name="theme-color" content="#0d1117" />\n    <meta name="apple-mobile-web-app-capable" content="yes" />\n    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />\n    <meta name="apple-mobile-web-app-title" content="Stars Manager" />\n    <meta name="format-detection" content="telephone=no" />'
          );

          replaceOnce(
            'src/components/Header.tsx',
            'sticky top-0 z-50 hd-drag lg:hd-drag relative">',
            "sticky top-0 z-50 hd-drag lg:hd-drag relative\" style={{ paddingTop: 'env(safe-area-inset-top)' }}>"
          );

          replaceOnce(
            'src/components/LoginScreen.tsx',
            '<div className="fixed top-4 right-4 flex items-center gap-2 z-50">',
            "<div className=\"fixed right-4 flex items-center gap-2 z-50\" style={{ top: 'calc(env(safe-area-inset-top, 0px) + 16px)' }}>"
          );

          replaceOnce(
            'src/components/ui/Toast.tsx',
            'className="fixed top-4 right-4 z-[100] animate-in slide-in-from-top-2 fade-in duration-200"',
            'className="fixed left-1/2 -translate-x-1/2 md:left-auto md:translate-x-0 md:right-4 z-[100] animate-in slide-in-from-top-2 fade-in duration-200"\n      style={{ top: \'calc(env(safe-area-inset-top, 0px) + 16px)\' }}'
          );

          replaceOnce(
            'src/components/ui/ConfirmDialog.tsx',
            'className="relative w-full max-w-md mx-4 bg-white dark:bg-panel-dark dark:border dark:border-white/[0.04] rounded-xl shadow-xl"',
            'className="relative w-full max-w-md mx-0 md:mx-4 bg-white dark:bg-panel-dark dark:border dark:border-white/[0.04] md:rounded-xl rounded-t-xl shadow-xl mb-0 md:mb-0"\n        style={{ marginBottom: \'env(safe-area-inset-bottom, 0px)\' }}'
          );

          replaceOnce(
            'src/components/ReadmeModal.tsx',
            'className="flex min-h-full items-center justify-center p-4 bg-black bg-opacity-50 transition-opacity"',
            'className="flex min-h-full items-end md:items-center justify-center md:p-4 bg-black bg-opacity-50 transition-opacity"'
          );
          replaceOnce(
            'src/components/ReadmeModal.tsx',
            'className="relative w-full bg-white dark:bg-panel-dark dark:border dark:border-white/[0.04] rounded-xl shadow-xl transform transition-all max-h-[90vh] flex flex-col"',
            'className="relative w-full bg-white dark:bg-panel-dark dark:border dark:border-white/[0.04] md:rounded-xl rounded-t-xl shadow-xl transform transition-all md:max-h-[90vh] max-h-[100dvh] flex flex-col"'
          );
          replaceOnce(
            'src/components/ReadmeModal.tsx',
            'className="flex items-center justify-between p-4 border-b border-black/[0.06] dark:border-white/[0.04] flex-shrink-0"',
            "className=\"flex items-center justify-between p-3 md:p-4 border-b border-black/[0.06] dark:border-white/[0.04] flex-shrink-0\" style={{ paddingTop: 'max(0.75rem, env(safe-area-inset-top))' }}"
          );

          replaceOnce(
            'src/App.tsx',
            'transition-colors duration-200">',
            'transition-colors duration-200 overflow-x-hidden">'
          );

          replaceOnce(
            'src/components/DiscoveryView.tsx',
            '    <div className="flex flex-col">\n',
            '    <div className="flex flex-col overflow-x-hidden min-w-0 w-full box-border" data-discovery-root>\n'
          );
          replaceOnce(
            'src/components/DiscoveryView.tsx',
            'className={\`flex-shrink-0 transition-transform duration-300 ease-in-out z-10 \${',
            'className={\`flex-shrink-0 overflow-x-hidden transition-transform duration-300 ease-in-out z-10 \${'
          );
          replaceOnce(
            'src/components/DiscoveryView.tsx',
            'className={\`flex-1 overflow-y-auto space-y-4 pr-2 \${isDesktopSafeMode',
            'className={\`flex-1 overflow-y-auto overflow-x-hidden space-y-4 \${isDesktopSafeMode'
          );

          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className={\`bg-white dark:bg-panel-dark border border-black/[0.06] dark:border-white/[0.04] p-5 transition-all duration-200 \${',
            'data-discovery-card\n      className={\`bg-white dark:bg-panel-dark border border-black/[0.06] dark:border-white/[0.04] p-4 sm:p-5 transition-all duration-200 overflow-hidden w-full box-border \${'
          );
          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className="flex items-start gap-3 sm:gap-4">',
            'className="flex items-start gap-3 sm:gap-4 min-w-0"'
          );
          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className="flex-1 min-w-0">',
            'className="flex-1 min-w-0 overflow-hidden">'
          );
          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className="font-semibold text-gray-900 dark:text-text-primary truncate"',
            'className="min-w-0 flex-1 font-semibold text-gray-900 dark:text-text-primary truncate"'
          );
          replaceOnce(
            'src/components/SubscriptionRepoCard.tsx',
            'className="flex items-center gap-4 text-sm text-gray-500 dark:text-text-tertiary"',
            'className="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm text-gray-500 dark:text-text-tertiary"'
          );

          replaceRegex(
            'src/components/settings/AIConfigPanel.tsx',
            /<div className="flex items-center justify-between">\n\s+<div className="flex items-center space-x-3">/,
            '<div className="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">\n              <div className="flex items-start space-x-3 min-w-0">'
          );
          replaceRegex(
            'src/components/settings/AIConfigPanel.tsx',
            /<div>\n\s+<h4 className="font-medium text-gray-900 dark:text-text-primary flex items-center">/,
            '<div className="min-w-0 flex-1">\n                  <h4 className="font-medium text-gray-900 dark:text-text-primary flex items-center flex-wrap gap-1">'
          );
          replaceOnce(
            'src/components/settings/AIConfigPanel.tsx',
            'className="text-sm text-gray-500 dark:text-text-tertiary">',
            'className="text-sm text-gray-500 dark:text-text-tertiary break-all">'
          );
          replaceOnce(
            'src/components/settings/AIConfigPanel.tsx',
            'className="flex items-center space-x-2">',
            'className="flex flex-wrap items-center gap-2 ml-7 sm:ml-0">'
          );
          EOF

          cat >> src/index.css <<'EOF'

          /* Web deployment: restored v0.6.2 phone and PWA layout fixes. */
          @media (max-width: 768px) {
            select {
              max-width: calc(100vw - 4rem);
              min-width: 0;
            }

            main * {
              min-width: 0;
            }
          }

          @media (max-width: 639px) {
            html,
            body,
            #root {
              width: 100%;
              max-width: 100%;
              overflow-x: hidden;
            }

            [data-discovery-root],
            [data-discovery-root] > div,
            [data-discovery-root] [class~="flex-1"] {
              min-width: 0;
              max-width: 100%;
            }

            [data-discovery-root] [role="tablist"] {
              max-width: 100%;
              overscroll-behavior-x: contain;
            }

            [data-discovery-card] {
              width: 100%;
              max-width: 100%;
              overflow: hidden;
            }

            [data-discovery-card] .truncate {
              min-width: 0;
            }
          }
          EOF

      - name: Install PWA build plugin
        run: npm install --no-save vite-plugin-pwa@1.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=github-stars
